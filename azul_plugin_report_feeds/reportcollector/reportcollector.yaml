pdfconversion:
  command: wkhtmltopdf
  options:
    - "--disable-javascript"
    - "--disable-external-links"
    - "--disable-internal-links"
    - "--disable-forms"
    - "--load-error-handling"
    - "ignore"
    - "--load-media-error-handling"
    - "ignore"
    - "--zoom"
    - "0.85"
    - "--image-dpi"
    - "120"
